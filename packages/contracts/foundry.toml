[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./" }]
gas_reports = ["StableUSD", "PaymentProcessor"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 32
fail_on_revert = false

# TODO(Phase 0): add [rpc_endpoints] and [etherscan] if/when deploying to a testnet.
