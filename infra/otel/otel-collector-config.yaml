# OpenTelemetry Collector (Part 7). The indexer exports OTLP here; the collector batches and
# forwards to Jaeger. The collector-in-the-middle gives batching, retry, and the option to fan out
# to Tempo / a vendor later without touching app code.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, debug]
  telemetry:
    logs:
      level: info
