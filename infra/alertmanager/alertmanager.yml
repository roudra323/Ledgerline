# Alertmanager routing (Phase 3). Routes all alerts to a demo webhook (Discord/Slack).
# Set ALERT_WEBHOOK_URL in .env and substitute it here, or use a Slack/Discord receiver.
global:
  resolve_timeout: 5m

route:
  receiver: demo-webhook
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    - matchers:
        - severity="critical"
      receiver: demo-webhook
      continue: true

receivers:
  - name: demo-webhook
    webhook_configs:
      # TODO(Phase 3): point at your Discord/Slack incoming webhook (see ALERT_WEBHOOK_URL).
      - url: "http://host.docker.internal:9094/dummy"
        send_resolved: true

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: ["alertname"]
