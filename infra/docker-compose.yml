# ChainStake full stack. `make demo` (from repo root) is the canonical one-command experience.
# Build context for app images is the REPO ROOT so pnpm workspaces resolve.
#
# NOTE: services are wired with sensible defaults but several depend on artifacts that land in later
# build phases (contract deploy, indexer image, dashboards). Treat this as the target topology.
name: chainstake

x-env: &default-env
  env_file:
    - ../.env

services:
  # ── Chain ──────────────────────────────────────────────────
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command: >-
      --host 0.0.0.0 --block-time 2
      --mnemonic "test test test test test test test test test test test junk"
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Second Anvil so RPC failover (viem fallback) is demonstrable.
  anvil2:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command: >-
      --host 0.0.0.0 --block-time 2
      --mnemonic "test test test test test test test test test test test junk"
    profiles: ["ha"]

  # Runs the deploy script once, writes addresses to the shared volume, then exits.
  deployer:
    image: ghcr.io/foundry-rs/foundry:latest
    working_dir: /contracts
    volumes:
      - ../packages/contracts:/contracts
      - shared-addresses:/out
    depends_on:
      anvil:
        condition: service_healthy
    # TODO(Phase 0/6): forge install + forge script Deploy.s.sol --broadcast, write addresses to /out
    entrypoint: ["sh", "-c", "echo 'TODO(Phase 0): forge script Deploy.s.sol' && sleep 1"]

  # ── Data ───────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    <<: *default-env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chainstake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chainstake}
      POSTGRES_DB: ${POSTGRES_DB:-chainstake}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chainstake}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Indexer (engine + API) ─────────────────────────────────
  indexer:
    build:
      context: ..
      dockerfile: apps/indexer/Dockerfile
    <<: *default-env
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
      deployer:
        condition: service_completed_successfully
    volumes:
      - shared-addresses:/shared-addresses:ro

  # ── Frontend ───────────────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    <<: *default-env
    ports:
      - "3000:3000"
    depends_on:
      - indexer

  # ── Load generator (demo profile only) ─────────────────────
  loadgen:
    build:
      context: ..
      dockerfile: infra/loadgen/Dockerfile
    <<: *default-env
    profiles: ["demo"]
    depends_on:
      anvil:
        condition: service_healthy
      deployer:
        condition: service_completed_successfully

  # ── Observability ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - indexer

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3002:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI

  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-chainstake}:${POSTGRES_PASSWORD:-chainstake}@postgres:5432/${POSTGRES_DB:-chainstake}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  shared-addresses:
