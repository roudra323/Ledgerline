name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.26.0
  NODE_VERSION: 22

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # `pnpm typecheck` fans out to every workspace, and @ledgerline/contracts typechecks by
      # compiling Solidity. Without Foundry on PATH this job fails at the contracts package.
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install --no-git foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts
        working-directory: packages/contracts
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check

  contracts:
    name: Foundry tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      # Foundry deps live in lib/ (git-ignored) and are installed here, not committed.
      # TODO(Block 2.0): pin both to a tag. Unpinned installs make the contracts build
      # non-reproducible, which is indefensible in a project whose thesis is determinism. Left
      # unpinned only because Block 2.0 is where the versions actually get chosen - pinning to a
      # guessed tag now would be worse than the honest TODO.
      - name: Install contract dependencies
        working-directory: packages/contracts
        run: |
          forge install foundry-rs/forge-std
          forge install OpenZeppelin/openzeppelin-contracts
      - name: forge build
        working-directory: packages/contracts
        run: forge build --sizes
      - name: forge test
        working-directory: packages/contracts
        run: forge test -vvv
      # TODO(Block 2.6): add `forge test --match-test invariant` and an optional slither job.

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # TODO(Block 4.5): replay-golden tests, once the replay service exists.

  integration:
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    # Every load-bearing ledger guarantee - the deferred balance trigger, the immutability
    # trigger, `permission denied` under ledgerline_app, the non-negative check, post()'s
    # idempotency - is proven only by these tests. Until 2026-09-06 this job was a stub, so they
    # ran on one laptop and nowhere else. implementation-guide.md Block 1.8 says it plainly: a
    # correctness test that isn't in CI is a test that will rot.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ledgerline
          POSTGRES_PASSWORD: ledgerline
          POSTGRES_DB: ledgerline
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # test/global-setup.ts creates and migrates a throwaway database per run from these, and
      # drops it afterwards. The ledgerline role owns the cluster, so it can CREATE DATABASE;
      # ledgerline_app is created by the immutability migration with this password.
      DATABASE_URL: postgresql://ledgerline:ledgerline@localhost:5432/ledgerline
      APP_DATABASE_URL: postgresql://ledgerline_app:ledgerline_app@localhost:5432/ledgerline
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
      # TODO(Part 4): add Anvil, fire real txs, assert projections, kill/restart mid-stream,
      # simulate a reorg. Needs the contracts (Part 2) and the chain writer (Part 3) first.

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build indexer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/indexer/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
