version: 2
updates:
  # Root + all workspace package.json files (pnpm workspace).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR for routine minor/patch bumps to keep noise down.
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directories:
      - /apps/indexer
      - /apps/web
      - /infra/loadgen
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
